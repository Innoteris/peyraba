<!-- meta tags and other links -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>HavioTop - Online Recharge & Payment Platform.</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/images/logo/favicon.png">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <!-- Fontasosome -->
    <link rel="stylesheet" href="assets/css/fontasosome.min.css">
    <!-- Fonts -->
    <link rel="stylesheet" href="assets/css/clash-display.css">
    <!-- Nice Select -->
    <link rel="stylesheet" href="assets/css/nice-select.css">
    <!-- AOS -->
    <link rel="stylesheet" href="assets/css/aos.css">
    <!-- Owl Carousel -->
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
    <!-- Slick -->
    <link rel="stylesheet" href="assets/css/slick.css">
    <!-- line awesome -->
    <link rel="stylesheet" href="assets/css/line-awesome.min.css">
    <!-- Main css -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <!--==================== Preloader Start ====================-->
    <div class="preloader">
        <div class="animation-container">
            <div class="lightning-container">
                <div class="lightning white"></div>
                <div class="lightning red"></div>
            </div>
            <div class="boom-container">
                <div class="shape circle big white"></div>
                <div class="shape circle white"></div>
                <div class="shape triangle big yellow"></div>
                <div class="shape disc white"></div>
                <div class="shape triangle blue"></div>
            </div>
            <div class="boom-container second">
                <div class="shape circle big white"></div>
                <div class="shape circle white"></div>
                <div class="shape disc white"></div>
                <div class="shape triangle blue"></div>
            </div>
        </div>
    </div>
    <!--==================== Preloader End ====================-->
    <!--==================== Overlay Start ====================-->
    <div class="body-overlay"></div>
    <!--==================== Overlay End ====================-->

    <!--==================== Sidebar Overlay End ====================-->
    <div class="sidebar-overlay"></div>
    <!--==================== Sidebar Overlay End ====================-->

    <!-- ==================== Scroll to Top End Here ==================== -->
    <a class="scroll-top"><i class="fas fa-angle-double-up"></i></a>
    <!-- ==================== Scroll to Top End Here ==================== -->


    <!-- ==================== Cursor Start Here ==================== -->
    <div class="cursor"></div>
    <!-- ==================== Cursor End Here ==================== -->
    <main class="overflow-hidden">

        <div id="smooth-wrapper">
            <div id="smooth-content">
                <!--========================== Signup Page Start ==========================-->
                <section class="sign__area">
                    <div class="sign__bg"><img src="assets/images/sign/sign-bg.webp" alt="img"></div>
                    <div class="sign__sp1"><img src="assets/images/wave-sp.png" alt="img"></div>
                    <div class="sign__sp2"><img src="assets/images/wave-sp.png" alt="img"></div>
                    <div class="container">
                        <div class="row g-4">
                            <div class="col-lg-6">
                                <div class="sign__left__blk">
                                    <div class="sign__label">
                                        <div class="footer__subs__label">
                                            <div class="footer__subs__shr">
                                                <img src="assets/images/logo/icon-dark.png" alt="img">
                                                <div class="footer__circle__text">
                                                    <p>We are best for your daily payment & bill pay.</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="sign__title">
                                        <span>Sign up Your Account</span>
                                        <h1>Start Your <span>Journey</span></h1>
                                    </div>
                                    <div class="back__to__home"><a href="index.html"><i
                                                class="fa-solid fa-arrow-left-long"></i>back to home</a></div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="sign__wrap">
                                    <form action="/">
                                        <div class="row g-4">
                                            <div class="col-lg-6 col-md-6 col-sm-6">
                                                <div class="sign__wrap__single">
                                                    <label for="inputFirstName" class="form-label form--label">First
                                                        Name</label>
                                                    <input type="text" class="form-control form--control"
                                                        id="inputFirstName" placeholder="Enter First Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-6 col-md-6 col-sm-6">
                                                <div class="sign__wrap__single">
                                                    <label for="inputLastName" class="form-label form--label">Last
                                                        Name</label>
                                                    <input type="text" class="form-control form--control"
                                                        id="inputLastName" placeholder="Enter Last Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-12">
                                                <div class="sign__wrap__single">
                                                    <label for="inputEmail" class="form-label form--label">Email
                                                        Address</label>
                                                    <input type="email" class="form-control form--control"
                                                        id="inputEmail" placeholder="Enter Email">
                                                </div>
                                            </div>
                                            <div class="col-lg-6 col-md-6 col-sm-6">
                                                <div class="sign__wrap__single">
                                                    <label for="inputPassword"
                                                        class="form-label form--label">Password</label>
                                                    <input type="password" class="form-control form--control"
                                                        id="inputPassword" placeholder="Enter password">
                                                </div>
                                            </div>
                                            <div class="col-lg-6 col-md-6 col-sm-6">
                                                <div class="sign__wrap__single">
                                                    <label for="inputRePassword" class="form-label form--label">Re -
                                                        Password</label>
                                                    <input type="password" class="form-control form--control"
                                                        id="inputRePassword" placeholder="Enter password">
                                                </div>
                                            </div>
                                            <div class="col-lg-12">
                                                <div class="sign__wrap__single">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox"
                                                            id="flexCheckDefault">
                                                        <label class="form-check-label" for="flexCheckDefault">
                                                            I agree with <a href="privacy-policy.html">Privacy
                                                                Policy</a>,
                                                            <a href="terms-of-Service.html">Terms
                                                                of Service</a>.
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-12">
                                                <div class="sign__wrap__single">
                                                    <button type="submit" class="common__btn"><span>Sign
                                                            Up</span><span><i
                                                                class="fa-solid fa-arrow-right"></i></span></button>
                                                </div>
                                            </div>
                                            <div class="col-lg-12">
                                                <div class="sign__other__options__bar">
                                                    <span></span>
                                                    <h5>Or continue with </h5>
                                                    <span></span>
                                                </div>
                                            </div>
                                            <div class="col-lg-12">
                                                <div class="sign__other__option">
                                                    <a href="https://accounts.google.com"><img
                                                            src="assets/images/sign/google.png" alt="img">Sign
                                                        Up with google </a>
                                                    <a href="https://account.apple.com"><img
                                                            src="assets/images/sign/apple.png" alt="img">Sign Up
                                                        with Apple</a>
                                                </div>
                                            </div>
                                            <div class="col-lg-12">
                                                <div class="sign__already">
                                                    <p>Already have an account? <a href="signin.html">Sign In</a></p>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!--========================== Signup Page End ==========================-->
            </div>
        </div>

    </main>
    <!-- Jquery js -->
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap Bundle Js -->
    <script src="assets/js/boostrap.bundle.min.js"></script>
    <!-- GSAP js -->
    <script src="assets/js/gsap.min.js"></script>
    <!-- ScrollTrigger js -->
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <!-- ScrollToPlugin js -->
    <script src="assets/js/ScrollToPlugin.min.js"></script>
    <!-- Slick js -->
    <script src="assets/js/slick.min.js"></script>
    <!-- AOS js -->
    <script src="assets/js/aos.js"></script>
    <!-- Owl Carousel js -->
    <script src="assets/js/owl.carousel.min.js"></script>
    <!-- Nice Select js -->
    <script src="assets/js/jquery.nice-select.min.js"></script>
    <!-- Waypoint js -->
    <script src="assets/js/waypoints.min.js"></script>
    <!-- Counter js -->
    <script src="assets/js/counter.min.js"></script>

    <!-- main js -->
    <script src="assets/js/main.js"></script>
</body>

</html>
